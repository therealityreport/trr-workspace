# Canonical shared Codex configuration for the TRR workspace.
# Reusable MCPs plus user-level/system-level plugins and skills live in
# ~/.codex/config.toml; trusted TRR-local settings live here without shadowing
# those user-owned capabilities.

personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-5.5"
model_reasoning_effort = "high"
web_search = "cached"
project_doc_max_bytes = 65536
project_doc_fallback_filenames = []

# Chrome DevTools is inherited from ~/.codex/config.toml so TRR uses the
# shared headless global default unless a session explicitly overrides it.

[agents]
max_threads = 6
max_depth = 1

[git_policy]
default_branch = "main"
create_branches = "only_when_user_says_create_a_new_branch_named_branch_in_current_chat"
cleanup = "merge_desired_changes_to_main_then_delete_redundant_local_and_remote_refs"
preflight = "run_git_status_short_branch_and_make_git_branch_report_before_branch_ref_changes"

[agents.pr_explorer]
description = "Repo and PR discovery, changed-surface mapping, merge-order context, and blocker identification."
config_file = "./agents/pr_explorer.toml"

[agents.reviewer]
description = "Risk-first review for correctness, regressions, security, and missing tests."
config_file = "./agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist for Codex, OpenAI, and framework/API verification."
config_file = "./agents/docs_researcher.toml"

[agents.code_mapper]
description = "Symbol, config, and dataflow mapping across the TRR workspace."
config_file = "./agents/code_mapper.toml"

[agents.browser_debugger]
description = "Managed-Chrome debugging and verification for browser behavior."
config_file = "./agents/browser_debugger.toml"

[agents.ui_fixer]
description = "Targeted UI and interaction fixes after mapping or browser debugging."
config_file = "./agents/ui_fixer.toml"

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=vwxfvzutyufrkhfgoeaa&features=docs%2Caccount%2Cdatabase%2Cdebugging%2Cdevelopment%2Cfunctions%2Cbranching%2Cstorage"
bearer_token_env_var = "TRR_SUPABASE_ACCESS_TOKEN"

[mcp_servers.modal-ops]
command = "/Users/thomashulihan/Projects/TRR/TRR-Backend/.venv/bin/python"
args = ["/Users/thomashulihan/Projects/TRR/TRR-Backend/scripts/modal/modal_ops_mcp.py"]
env = { MODAL_PROFILE = "admin-56995", MODAL_PROFILE_NAME = "admin-56995", MODAL_PROFILE_LABEL = "TRR Backend Jobs", TRR_MODAL_APP_NAME = "trr-backend-jobs" }
