version: 1
# WS3-PENDING (additive, intentionally NOT enabled yet): enable these only once the
# shared design-docs-contracts TS package exports them AND both targets import it.
# Enabling before the target .ts exports exist turns the compile-time gate RED.
#   pipeline_types new interfaces:
#     - CaptureMetadata       # captureMethod, viewport, waitStrategy, overlayRemovals
#     - FigmaTokenCrossref    # figmaVariableDefinitions, matches, divergences
#     - NetworkAssetManifest  # absoluteUrl, type, mirroredPath, role, failureReason
#   MergedExtractionOutput additive fields:
#     - captureMethod, statefulInteractionSequences, uiPrimitiveRecords,
#       figmaTokenCrossref, networkAssetManifest, figmaRoundTripSummary
files:
  pipeline_types:
    # app-web-relative; resolved against DESIGN_DOCS_APP_WEB_ROOT (default TRR-APP/apps/web)
    path: src/lib/admin/design-docs-pipeline-types.ts
    interfaces:
      - TechInventory
      - PublisherClassification
      - ArticleVisualContract
      - MergedExtractionOutput
      - SourceFidelityResult
      - AuditResult
      - A11yAuditResult
      - IntegrationTestResult
    interface_field_requirements:
      PublisherClassification:
        - techInventory
        - layoutFamily
        - taxonomyMapping
        - extractionPlan
        - bespokeInteractive
        - requiresVisualContract
        - classificationSignals
      ArticleVisualContract:
        - chrome
        - typography
        - charts
        - assets
        - severitySummary
      MergedExtractionOutput:
        - articleUrl
        - sourceHtmlLength
        - publisherClassification
        - navigationData
        - techInventory
        - visualContract
        - legacyFidelityMode
      SourceFidelityResult:
        - articleId
        - passed
        - legacyMode
        - blockingFindings
        - degradedFindings
    type_aliases:
      LayoutFamily:
        union_literals:
          - nyt-interactive
          - nyt-article
          - athletic-article
          - generic-publisher
  design_docs_config:
    # app-web-relative; resolved against DESIGN_DOCS_APP_WEB_ROOT (default TRR-APP/apps/web)
    path: src/lib/admin/design-docs-config.ts
    consts:
      - DESIGN_DOC_SECTIONS
    functions:
      - isDesignDocSectionId
    type_aliases:
      DesignDocSectionId:
        union_literals:
          - brand-nyt
          - brand-the-athletic
          - athletic-articles
          - nyt-articles
      DesignDocSection: {}
