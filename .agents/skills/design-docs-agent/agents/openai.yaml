# Canonical runtime roster and phase-order source for the shared Design Docs package.
# `wave` is rollout metadata only. It does not affect runtime ordering.
schema_version: 1
package_version: "2.0.0"
interface:
  display_name: "Design Docs Agent (TRR)"
  short_description: "Generate or update TRR design-docs pages from article URLs, saved source bundles, HTML captures, and source inventories."
  default_prompt: "Use $design-docs-agent to ingest an articleUrl with an optional saved source bundle, acquire a bundle when needed, validate the bundle contract, extract structure and media, and generate or update the matching TRR design-docs pages."
dependencies:
  tools:
    - type: "mcp"
      value: "chrome-devtools"
      description: "Optional browser extraction for embeds, CSS discovery, computed-style verification, rendered-DOM capture, golden screenshots, and network asset harvest"
    - type: "mcp"
      value: "figma"
      description: "Optional HTML-to-Figma capture (generate_figma_design), design-system token cross-reference, and design-context round-trip"
    - type: "mcp"
      value: "scrapling"
      description: "Optional tier-3 stealth acquisition for WAF/Cloudflare/paywall-protected sources"
    - type: "skill"
      value: "figma-use"
      description: "Required preload before any use_figma write call"
    - type: "skill"
      value: "figma-create-new-file"
      description: "Required preload before any create_new_file call"
shared_capabilities:
  - browser.navigate
  - browser.snapshot
  - browser.evaluate
  - browser.network.list
  - browser.network.get
  - browser.screenshot
  - browser.resize
  - browser.click
  - browser.hover
  - delegate.parallel
  - fs.edit
  - check.typecheck
  - figma.create_file
  - figma.generate_design
  - figma.use
  - figma.search_design_system
  - figma.get_variable_defs
  - figma.get_design_context
  - scrapling.stealthy_fetch
  - scrapling.screenshot
pipeline:
  - phase: validation
  - phase: pre-extraction
  - phase: extraction
  - phase: generation
  - phase: wiring
  - phase: verification
    members:
      - skill: audit-generated-config-integrity
      - skill: verify-source-fidelity
      - skill: sync-brand-page
      - skill: audit-responsive-accessibility
      - skill: integration-test-runner
      - capability: check.typecheck
skillset:
  version: 6
  supporting:
    - skill: senior-frontend
      source: "skill://senior-frontend"
      role: "App Router, server/client boundaries, rendering conventions"
      phases: [extraction, generation]
      wave: 1
      status: active
      version: "1.0.0"
    - skill: senior-qa
      source: "skill://senior-qa"
      role: "Risk-ranked validation, verification report structure"
      phases: [verification]
      wave: 1
      status: active
      version: "1.0.0"
    - skill: code-reviewer
      source: "skill://code-reviewer"
      role: "Pre-closeout correctness gate for generated TypeScript"
      phases: [closeout]
      wave: 1
      status: active
      version: "1.0.0"
    - skill: font-sync
      source: "skill://font-sync"
      role: "Font specimen generation, R2 upload, font-family validation"
      phases: [post-generation]
      wave: 1
      status: active
      version: "1.0.0"
